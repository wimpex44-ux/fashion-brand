<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse the Maison Miro clothing collection of elevated essentials and statement layers." />
    <title>Shop | Maison Miro</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="shop">
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand">Maison Miro</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-pill">Home</a>
          <a href="shop.html" class="nav-pill active">Tshirt</a>
          <a href="shop.html" class="nav-pill">Hoodies</a>
          <a href="shop.html" class="nav-pill">Sweatshirts</a>
          <a href="about.html" class="nav-pill">About Us</a>
        </nav>
        <div class="nav-actions">
          <a href="cart.html" class="icon-button" aria-label="Cart">
            🛒
            <span class="cart-count hidden">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container page-hero">
        <div class="breadcrumbs"><a href="index.html">Home</a> / <span>Shop</span></div>
        <h1>Shop the collection</h1>
      </div>

      <div class="container">
        <div class="filters filter-controls">
          <button class="filter-pill active" type="button" data-filter="all">All</button>
          <button class="filter-pill" type="button" data-filter="tshirt">Tshirts</button>
          <button class="filter-pill" type="button" data-filter="hoodies">Hoodies</button>
          <button class="filter-pill" type="button" data-filter="sweatshirts">Sweatshirts</button>
          <select class="filter-select" data-category-filter aria-label="Filter by category">
            <option value="all">All categories</option>
            <option value="tshirt">Tshirts</option>
            <option value="hoodies">Hoodies</option>
            <option value="sweatshirts">Sweatshirts</option>
          </select>
          <select class="filter-select" data-sort-filter aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </div>
      </div>

      <div class="container">
        <div class="card-grid" data-product-grid></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-grid">
        <div>
          <div class="brand">Maison Miro</div>
          <p>Minimal wardrobe essentials with refined tailoring and modern ease.</p>
        </div>
        <div>
          <h4>Shop</h4>
          <ul>
            <li><a href="shop.html">Clothing</a></li>
            <li><a href="patterns.html">Patterns</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="assets/js/app.js"></script>
  </body>
</html>
