<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Maison Miro</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="login">
    <main class="page-shell">
      <div class="auth-card">
        <h1>Studio admin</h1>
        <form data-admin-login-form>
          <div class="form-grid">
            <div class="form-field full"><label for="adminEmail">Email</label><input id="adminEmail" type="email" placeholder="studio@maisonmiro.com" value="studio@maisonmiro.com" /></div>
            <div class="form-field full"><label for="adminPass">Password</label><input id="adminPass" type="password" value="atelier2025" /></div>
          </div>
          <button class="btn btn-primary login-action" type="submit">Login</button>
          <p class="form-message muted" data-form-message></p>
        </form>
      </div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
