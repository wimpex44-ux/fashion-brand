<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Manager | Maison Miro Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="products">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">Maison Miro</div>
        <nav class="side-nav" aria-label="Admin menu">
          <a class="side-link" href="index.html">Dashboard</a>
          <a class="side-link active" href="products.html">Products</a>
          <a class="side-link" href="patterns.html">Patterns</a>
          <a class="side-link" href="bookings.html">Bookings</a>
          <a class="side-link" href="portfolio.html">Portfolio</a>
          <a class="side-link" href="orders.html">Orders</a>
        </nav>
      </aside>
      <main class="admin-main">
        <div class="page-hero">
          <h1>Products manager</h1>
        </div>

        <div class="form-panel" style="margin-bottom: 24px;">
          <h3 data-product-form-title>Add new product</h3>
          <form data-product-form>
            <input type="hidden" name="id" />
            <div class="form-grid">
              <div class="form-field"><label>Name</label><input name="name" type="text" required /></div>
              <div class="form-field"><label>Category</label><input name="category" type="text" value="Essentials" required /></div>
              <div class="form-field"><label>Color</label><input name="color" type="text" value="Neutral" /></div>
              <div class="form-field"><label>Price</label><input name="price" type="number" step="0.01" min="0" required /></div>
              <div class="form-field"><label>Original price</label><input name="originalPrice" type="number" step="0.01" min="0" /></div>
              <div class="form-field full"><label>Sizes</label><input name="sizes" type="text" placeholder="XS, S, M, L, XL" /></div>
              <div class="form-field full"><label>Description</label><textarea name="description" required></textarea></div>
              <div class="form-field"><label>Main image</label><input name="imageFile" type="file" accept="image/*" /></div>
              <div class="form-field"><label>Image URL</label><input name="image" type="text" placeholder="/uploads/filename.jpg" /></div>
              <div class="form-field full"><label>Gallery images</label><input name="galleryFiles" type="file" accept="image/*" multiple /></div>
              <div class="form-field full"><label>Gallery URLs</label><input name="gallery" type="text" placeholder="Comma-separated image URLs" /></div>
            </div>
            <div class="btn-row" style="margin-top: 18px;">
              <button class="btn btn-primary" type="submit">Save product</button>
              <button class="btn btn-secondary" type="button" data-product-cancel>Cancel</button>
            </div>
            <p class="form-message muted" data-form-message></p>
          </form>
        </div>

        <div class="form-panel">
          <table class="table">
            <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Sizes</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody data-product-table></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="admin.js"></script>
  </body>
</html>
