<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure checkout for Maison Miro orders with Stripe-ready payment flow." />
    <title>Checkout | Maison Miro</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="checkout">
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand">Maison Miro</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-pill">Home</a>
          <a href="shop.html" class="nav-pill">Shop</a>
          <a href="patterns.html" class="nav-pill">Patterns</a>
          <a href="book.html" class="nav-pill">Book</a>
        </nav>
        <div class="nav-actions">
          <a href="cart.html" class="icon-button" aria-label="Cart">
            🛒
            <span class="cart-count hidden">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container page-hero">
        <div class="breadcrumbs"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div>
        <h1>Checkout</h1>
      </div>
      <div class="container checkout-layout">
        <section class="form-panel">
          <form data-ajax-form>
            <div class="form-grid">
              <div class="form-field"><label for="firstName">First name</label><input id="firstName" name="firstName" required /></div>
              <div class="form-field"><label for="lastName">Last name</label><input id="lastName" name="lastName" required /></div>
              <div class="form-field full"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
              <div class="form-field full"><label for="address">Street address</label><input id="address" name="address" required /></div>
              <div class="form-field"><label for="city">City</label><input id="city" name="city" required /></div>
              <div class="form-field"><label for="country">Country</label><select id="country" name="country"><option>United States</option><option>United Kingdom</option><option>Canada</option></select></div>
              <div class="form-field full"><label for="notes">Delivery notes</label><textarea id="notes" name="notes"></textarea></div>
            </div>
            <p class="form-message" data-form-message></p>
          </form>
        </section>
        <aside class="summary-panel" data-checkout-summary></aside>
      </div>
    </main>

    <script src="assets/js/app.js"></script>
  </body>
</html>
